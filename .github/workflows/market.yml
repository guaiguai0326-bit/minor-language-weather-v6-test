name: Refresh 9-country market intelligence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collect_market.py'
      - '.github/workflows/market.yml'
  schedule:
    - cron: '15 1 * * *'
permissions:
  contents: write
concurrency:
  group: market-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect market feeds and translations
        run: python collect_market.py
      - name: Commit fresh data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh 9-country market intelligence"
            git push
          fi
